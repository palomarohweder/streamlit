[project]
name = "teste-streamlit"
version = "0.1.0"
description = "Gestão de equipamentos e experimentos do Laboratório de Física do IFC Blumenau"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymysql>=1.1,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "streamlit>=1.66.1",
]

[project.scripts]
teste-streamlit = "teste_streamlit:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
